<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" width="320" height="64" role="img" aria-label="PRINTWORKS PRINT &amp; COPY Logo">
  <!-- Symbol: Precision Digital Print Engine & Stacked Media with Creative Registration Spark -->
  <g id="symbol" transform="translate(6, 6)">
    <!-- Back Paper Sheet (Angled Tactile Media) -->
    <rect x="12" y="3" width="28" height="36" rx="4" fill="#E8E1FF" stroke="#356AE6" stroke-width="2" transform="rotate(-7 26 21)"/>
    
    <!-- Mid Paper Sheet (Fresh Mint Media) -->
    <rect x="22" y="3" width="28" height="36" rx="4" fill="#BFEAD8" stroke="#356AE6" stroke-width="2" transform="rotate(5 36 21)"/>

    <!-- Main Digital Production Printer Body -->
    <rect x="6" y="18" width="46" height="30" rx="6" fill="#356AE6"/>
    
    <!-- Paper Feed Tray / Precision Slot -->
    <rect x="12" y="34" width="34" height="4" rx="2" fill="#FFFFFF"/>
    
    <!-- Emerging High-Definition Print Sheet -->
    <rect x="15" y="24" width="28" height="12" rx="3" fill="#FFFDF8" stroke="#FFD76A" stroke-width="2"/>
    <line x1="20" y1="28" x2="38" y2="28" stroke="#356AE6" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="32" x2="31" y2="32" stroke="#FFD76A" stroke-width="2" stroke-linecap="round"/>

    <!-- Creative Print Registration Spark / Sunshine Star Accent -->
    <g transform="translate(42, 6)">
      <circle cx="8" cy="8" r="7.5" fill="#FFD76A"/>
      <!-- Precision 4-point print alignment star -->
      <path d="M8 2.5 L9.5 6.5 L13.5 8 L9.5 9.5 L8 13.5 L6.5 9.5 L2.5 8 L6.5 6.5 Z" fill="#263238"/>
    </g>
  </g>

  <!-- Wordmark & Descriptor -->
  <g id="wordmark" transform="translate(70, 12)">
    <!-- Primary PRINTWORKS Wordmark -->
    <text x="0" y="26" font-family="'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="25" fill="#263238" letter-spacing="-0.5">PRINT<tspan fill="#356AE6">WORKS</tspan></text>
    
    <!-- Descriptor: PRINT & COPY with Yellow Precision Dot Accent -->
    <text x="1" y="42" font-family="'Inter', 'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10.5" fill="#68747D" letter-spacing="3.4">PRINT &amp; COPY</text>
    <circle cx="156" cy="38.5" r="3.5" fill="#FFD76A"/>
  </g>
</svg>
